spring.application.name=sistema

spring.datasource.url=${SUNKU_DB_URL}
spring.datasource.username=${SUNKU_DB_USERNAME}
spring.datasource.password=${SUNKU_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

supabase.project-url=${SUNKU_SUPABASE_URL}
supabase.secret-key=${SUNKU_SUPABASE_SECRET_KEY}

logging.level.org.springframework.security=DEBUG