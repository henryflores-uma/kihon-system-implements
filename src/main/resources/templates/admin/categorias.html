
<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías | Sunkku Sinchi</title>

  <link rel="stylesheet" th:href="@{/css/main.css}">
  <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
  <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">

  <style>
    .categorias-page,
    .categorias-page * {
      box-sizing: border-box;
    }

    .categorias-page {
      min-height: calc(100vh - 70px);
      background: #f6f6f6;
      padding: 32px 34px;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #242424;
    }

    .categorias-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .categorias-ruta {
      color: #999;
      font-size: 11px;
      margin: 0 0 14px;
    }

    .categorias-titulo {
      font-size: 29px;
      font-weight: 750;
      margin: 0 0 10px;
    }

    .categorias-subtitulo {
      font-size: 13px;
      color: #888;
      margin: 0;
    }

    .btn-principal {
      background: #ff2600;
      color: white;
      border: 1px solid #ff2600;
      padding: 13px 19px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-principal:hover {
      background: #df2100;
    }

    .tarjeta {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      box-shadow: 0 2px 6px #00000006;
    }

    .buscador-tarjeta {
      padding: 22px;
      margin-bottom: 20px;
    }

    .buscador-tarjeta label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .buscador-fila {
      display: flex;
      gap: 12px;
    }

    .buscador-fila input {
      flex: 1;
      min-width: 0;
      height: 45px;
      padding: 0 14px;
      border: 1px solid #e2e2e2;
      border-radius: 5px;
      font-size: 13px;
      outline: none;
    }

    .buscador-fila input:focus {
      border-color: #ff2600;
    }

    .btn-buscar {
      border: 1px solid #e2e2e2;
      background: white;
      border-radius: 5px;
      padding: 0 18px;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }

    .btn-buscar:hover {
      background: #f5f5f5;
    }

    .contador {
      font-size: 11px;
      color: #999;
      margin: 16px 0 0;
    }

    .tabla-contenedor {
      overflow-x: auto;
    }

    .tabla-categorias {
      width: 100%;
      min-width: 620px;
      border-collapse: collapse;
      text-align: left;
    }

    .tabla-categorias thead {
      background: #ededed;
    }

    .tabla-categorias th {
      font-size: 12px;
      padding: 18px 22px;
    }

    .tabla-categorias th:first-child {
      width: 65%;
    }

    .tabla-categorias th:nth-child(2) {
      width: 12%;
    }

    .tabla-categorias td {
      padding: 20px 22px;
      border-bottom: 1px solid #ededed;
      vertical-align: middle;
    }

    .tabla-categorias tbody tr:last-child td {
      border-bottom: none;
    }

    .nombre-categoria {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .descripcion-categoria {
      display: block;
      font-size: 11px;
      color: #999;
    }

    .estado {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 20px;
      padding: 7px 11px;
      font-size: 11px;
      font-weight: 650;
    }

    .estado::before {
      content: "";
      width: 5px;
      height: 5px;
      background: currentColor;
      border-radius: 50%;
    }

    .estado.activo {
      background: #fff7d6;
      color: #574900;
    }

    .estado.inactivo {
      background: #eee;
      color: #555;
    }

    .acciones {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-editar,
    .btn-eliminar {
      padding: 11px 13px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-editar {
      background: #fff;
      color: #333;
      border: 1px solid #e2e2e2;
    }

    .btn-eliminar {
      background: #fff0ed;
      color: #d22b19;
      border: 1px solid transparent;
    }

    .btn-eliminar:disabled {
      opacity: .5;
      cursor: wait;
    }

    .sin-resultados {
      text-align: center;
      color: #888;
      font-size: 13px;
      padding: 35px !important;
    }

    .paginacion {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-top: 23px;
      font-size: 11px;
      color: #999;
    }

    .paginacion-botones,
    #numerosPagina {
      display: flex;
      gap: 7px;
    }

    .paginacion button {
      border: 1px solid #e5e5e5;
      border-radius: 5px;
      padding: 11px 13px;
      background: #eee;
      font-size: 11px;
      cursor: pointer;
    }

    .paginacion button.actual {
      background: #050505;
      color: white;
      border-color: #050505;
    }

    .paginacion button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .pie-pagina {
      margin-top: 30px;
      color: #aaa;
      font-size: 11px;
    }

    .mensaje {
      margin-top: 15px;
      font-size: 12px;
      color: #b91c1c;
    }

    @media (max-width: 750px) {
      .categorias-page {
        padding: 22px 16px;
      }

      .categorias-header {
        flex-direction: column;
        align-items: stretch;
      }

      .buscador-fila {
        flex-direction: column;
      }

      .btn-buscar {
        min-height: 43px;
      }

      .paginacion {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>

  <script th:src="@{/js/acordeon.js}" defer></script>
  <script th:src="@{/js/nav-acordeon.js}" defer></script>
</head>

<body>
<main class="app-layout">

  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <div id="mobileMenuOverlay"
       class="mobile-menu-overlay"
       hidden></div>

  <section class="main-content">

    <div class="mobile-nav">
      <button type="button"
              class="mobile-menu-button"
              id="mobileMenuButton"
              aria-label="Abrir menú"
              aria-expanded="false"
              aria-controls="mainSidebar">
        <span id="mobileMenuIcon">☰</span>
      </button>

      <strong class="mobile-nav__logo">
        SUNKKU SINCHI
      </strong>
    </div>

    <div th:replace="~{fragments/topbar :: topbar}"></div>

    <div class="categorias-page">

      <div class="categorias-header">
        <div>
          <p class="categorias-ruta">
            Inicio / Gestión / Categorías
          </p>

          <h1 class="categorias-titulo">
            Categorías
          </h1>

          <p class="categorias-subtitulo">
            Organiza los productos de la academia.
          </p>
        </div>

        <a class="btn-principal"
           th:href="@{/admin/categorias/nueva}"
           href="/admin/categorias/nueva">
          <span>＋</span>
          Nueva categoría
        </a>
      </div>

      <div class="tarjeta buscador-tarjeta">

        <label for="buscarCategoria">
          Buscar categorías
        </label>

        <form id="formBuscar" class="buscador-fila">

          <input type="search"
                 id="buscarCategoria"
                 placeholder="Buscar por nombre"
                 autocomplete="off">

          <button type="submit" class="btn-buscar">
            ⌕ &nbsp; Buscar
          </button>
        </form>

        <p class="contador" id="contadorCategorias">
          Cargando categorías...
        </p>

        <p id="mensajeError" class="mensaje" role="alert"></p>
      </div>

      <div class="tarjeta tabla-contenedor">

        <table class="tabla-categorias">
          <thead>
            <tr>
              <th>Categoría</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>

          <tbody id="tablaCategorias">
            <tr>
              <td colspan="3" class="sin-resultados">
                Cargando categorías...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="paginacion">

        <span id="textoPaginacion">
          Mostrando 0 de 0
        </span>

        <div class="paginacion-botones">

          <button type="button" id="anterior">
            Anterior
          </button>

          <span id="numerosPagina"></span>

          <button type="button" id="siguiente">
            Siguiente
          </button>

        </div>
      </div>

      <p class="pie-pagina">
        Sunkku Sinchi · Panel de administración
      </p>
    </div>

  </section>
</main>

<script th:inline="javascript">
document.addEventListener("DOMContentLoaded", () => {

  const API = /*[[@{/api/categorias}]]*/ "/api/categorias";

  const EDITAR_URL =
    /*[[@{/admin/categorias/editar/}]]*/ "/admin/categorias/editar/";

  const csrfToken =
    document.querySelector('meta[name="_csrf"]')?.content;

  const csrfHeader =
    document.querySelector('meta[name="_csrf_header"]')?.content;

  const tabla = document.getElementById("tablaCategorias");
  const buscador = document.getElementById("buscarCategoria");
  const contador = document.getElementById("contadorCategorias");
  const mensajeError = document.getElementById("mensajeError");

  let categorias = [];
  let filtradas = [];
  let pagina = 1;

  const POR_PAGINA = 6;

  function obtenerId(categoria) {
    return categoria.idCategoria ?? categoria.id;
  }

  function obtenerEstado(categoria) {
    const valor = categoria.estado;

    if (valor === true || valor === 1) return "ACTIVO";
    if (valor === false || valor === 0) return "INACTIVO";

    if (valor && typeof valor === "object") {
      return String(valor.nombre ?? valor.estado ?? "").toUpperCase();
    }

    return String(valor ?? "").toUpperCase();
  }

  function escapar(texto) {
    return String(texto ?? "").replace(/[&<>"']/g, caracter => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[caracter]);
  }

  async function cargarCategorias() {
    mensajeError.textContent = "";

    try {
      const respuesta = await fetch(API, {
        credentials: "same-origin"
      });

      if (!respuesta.ok) {
        throw new Error("No se pudieron consultar las categorías.");
      }

      const datos = await respuesta.json();

      if (!Array.isArray(datos)) {
        throw new Error("La API no devolvió una lista válida.");
      }

      categorias = datos;
      filtrarCategorias();

    } catch (error) {
      categorias = [];
      filtradas = [];

      tabla.innerHTML = `
        <tr>
          <td colspan="3" class="sin-resultados">
            No se pudieron cargar las categorías.
          </td>
        </tr>
      `;

      contador.textContent = "Error al cargar";
      mensajeError.textContent = error.message;
      actualizarPaginacion();
    }
  }

  function filtrarCategorias() {
    const texto = buscador.value.trim().toLowerCase();

    filtradas = categorias.filter(categoria =>
      String(categoria.nombre ?? "")
        .toLowerCase()
        .includes(texto)
    );

    pagina = 1;
    mostrarCategorias();
  }

  function mostrarCategorias() {
    const inicio = (pagina - 1) * POR_PAGINA;
    const elementos = filtradas.slice(inicio, inicio + POR_PAGINA);

    contador.textContent =
      `${filtradas.length} categorías en el catálogo`;

    if (elementos.length === 0) {
      tabla.innerHTML = `
        <tr>
          <td colspan="3" class="sin-resultados">
            No se encontraron categorías.
          </td>
        </tr>
      `;
    } else {
      tabla.innerHTML = elementos.map(categoria => {

        const id = obtenerId(categoria);
        const activo = obtenerEstado(categoria) === "ACTIVO";

        return `
          <tr>
            <td>
              <span class="nombre-categoria">
                ${escapar(categoria.nombre)}
              </span>

              <span class="descripcion-categoria">
                ${escapar(categoria.descripcion)}
              </span>
            </td>

            <td>
              <span class="estado ${activo ? "activo" : "inactivo"}">
                ${activo ? "Activo" : "Inactivo"}
              </span>
            </td>

            <td>
              <div class="acciones">

                <a class="btn-editar"
                   href="${EDITAR_URL}${encodeURIComponent(id)}">
                  Editar
                </a>

                <button class="btn-eliminar"
                        type="button"
                        data-id="${escapar(id)}">
                  Eliminar
                </button>

              </div>
            </td>
          </tr>
        `;
      }).join("");
    }

    actualizarPaginacion();
  }

  function actualizarPaginacion() {
    const total = filtradas.length;
    const paginas = Math.max(1, Math.ceil(total / POR_PAGINA));
    const inicio = (pagina - 1) * POR_PAGINA;

    document.getElementById("textoPaginacion").textContent =
      `Mostrando ${total ? inicio + 1 : 0}–${Math.min(inicio + POR_PAGINA, total)} de ${total}`;

    document.getElementById("anterior").disabled = pagina <= 1;
    document.getElementById("siguiente").disabled = pagina >= paginas;

    const contenedor = document.getElementById("numerosPagina");
    contenedor.replaceChildren();

    for (let i = 1; i <= paginas; i++) {
      const boton = document.createElement("button");

      boton.type = "button";
      boton.textContent = i;

      if (i === pagina) boton.className = "actual";

      boton.addEventListener("click", () => {
        pagina = i;
        mostrarCategorias();
      });

      contenedor.appendChild(boton);
    }
  }

  document.getElementById("formBuscar")
    .addEventListener("submit", evento => {
      evento.preventDefault();
      filtrarCategorias();
    });

  buscador.addEventListener("input", filtrarCategorias);

  document.getElementById("anterior")
    .addEventListener("click", () => {
      if (pagina > 1) {
        pagina--;
        mostrarCategorias();
      }
    });

  document.getElementById("siguiente")
    .addEventListener("click", () => {
      if (pagina < Math.ceil(filtradas.length / POR_PAGINA)) {
        pagina++;
        mostrarCategorias();
      }
    });

  tabla.addEventListener("click", async evento => {
    const boton = evento.target.closest("[data-id]");

    if (!boton) return;

    const id = boton.dataset.id;
    const categoria = categorias.find(c =>
      String(obtenerId(c)) === id
    );

    if (!categoria) return;

    if (!confirm(`¿Eliminar la categoría "${categoria.nombre}"?`)) {
      return;
    }

    boton.disabled = true;

    try {
      const headers = {};

      if (csrfToken && csrfHeader) {
        headers[csrfHeader] = csrfToken;
      }

      const respuesta = await fetch(
        `${API}/${encodeURIComponent(id)}`,
        {
          method: "DELETE",
          credentials: "same-origin",
          headers
        }
      );

      if (!respuesta.ok) {
        throw new Error("No se pudo eliminar la categoría.");
      }

      await cargarCategorias();

    } catch (error) {
      mensajeError.textContent = error.message;
      boton.disabled = false;
    }
  });

  cargarCategorias();
});
</script>

</body>
</html>
