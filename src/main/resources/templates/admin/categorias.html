<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categorías | Sunkku Sinchi</title>

    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}" />
    <meta
      name="_csrf_header"
      th:content="${_csrf != null ? _csrf.headerName : ''}"
    />

    <script th:src="@{/js/acordeon.js}" defer></script>
    <script th:src="@{/js/nav-acordeon.js}" defer></script>
  </head>

  <body>
    <main class="app-layout">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>

      <div id="mobileMenuOverlay" class="mobile-menu-overlay" hidden></div>

      <section class="main-content">
        <div class="mobile-nav">
          <button
            type="button"
            class="mobile-menu-button"
            id="mobileMenuButton"
            aria-label="Abrir menú"
            aria-expanded="false"
            aria-controls="mainSidebar"
          >
            <span id="mobileMenuIcon">☰</span>
          </button>

          <strong class="mobile-nav__logo"> SUNKKU SINCHI </strong>
        </div>

        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <div
          class="categorias-page"
          th:attr="data-api=@{/api/categorias},
                      data-editar-url=@{/admin/categorias/editar/}"
        >
          <!-- Encabezado -->
          <div class="categorias-header">
            <div>
              <p class="categorias-ruta">Inicio / Gestión / Categorías</p>

              <h1 class="categorias-titulo">Categorías</h1>

              <p class="categorias-subtitulo">
                Organiza los productos de la academia.
              </p>
            </div>

            <a class="btn-principal" th:href="@{/admin/categorias/nueva}">
              <span>＋</span>
              Nueva categoría
            </a>
          </div>

          <!-- Buscador -->
          <div class="tarjeta buscador-tarjeta">
            <label for="buscarCategoria"> Buscar categorías </label>

            <form id="formBuscar" class="buscador-fila">
              <input
                type="search"
                id="buscarCategoria"
                placeholder="Buscar por nombre"
                autocomplete="off"
              />

              <button type="submit" class="btn-buscar">⌕ &nbsp; Buscar</button>
            </form>

            <p class="contador" id="contadorCategorias">
              Cargando categorías...
            </p>

            <p id="mensajeError" class="mensaje" role="alert"></p>
          </div>

          <!-- Tabla -->
          <div class="tarjeta tabla-contenedor">
            <table class="tabla-categorias">
              <thead>
                <tr>
                  <th>Categoría</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>

              <tbody id="tablaCategorias">
                <tr>
                  <td colspan="3" class="sin-resultados">
                    Cargando categorías...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Paginación -->
          <div class="paginacion">
            <span id="textoPaginacion"> Mostrando 0 de 0 </span>

            <div class="paginacion-botones">
              <button type="button" id="anterior">Anterior</button>

              <span id="numerosPagina"></span>

              <button type="button" id="siguiente">Siguiente</button>
            </div>
          </div>

          <!-- Pie -->
          <p class="pie-pagina">Sunkku Sinchi · Panel de administración</p>
        </div>
      </section>
    </main>

    <!-- Scripts compartidos -->
    <script th:src="@{/js/topbar.js}" defer></script>
    <script th:src="@{/js/logout.js}" defer></script>

    <!-- Script exclusivo de categorías -->
    <script th:src="@{/js/categorias/categorias.js}" defer></script>
  </body>
</html>
