<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <title>Gestión de Productos | Sunkku Sinchi</title>

    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <script th:src="@{/js/acordeon.js}" defer></script>
    <script th:src="@{/js/nav-acordeon.js}" defer></script>
    <script th:src="@{/js/topbar.js}" defer></script>
    <script th:src="@{/js/logout.js}" defer></script>
    <script th:src="@{/js/productos/productos-form.js}" defer></script>
  </head>

  <body>
    <main class="app-layout">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
      <div id="mobileMenuOverlay" class="mobile-menu-overlay" hidden></div>

      <section class="main-content">
        <div class="mobile-nav">
          <button
            type="button"
            class="mobile-menu-button"
            id="mobileMenuButton"
            aria-label="Abrir menú"
            aria-expanded="false"
            aria-controls="mainSidebar"
          >
            <span id="mobileMenuIcon">☰</span>
          </button>

          <strong class="mobile-nav__logo">SUNKKU SINCHI</strong>
        </div>

        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <div
          class="productos-form-page content-wrapper"
          th:attr="
            data-api-productos=@{/api/productos},
            data-api-categorias=@{/api/categorias},
            data-listado-url=@{/admin/productos},
            data-producto-id=${productoId}
          "
        >
          <nav
            class="productos-form__breadcrumb"
            aria-label="Ruta de navegación"
          >
            Inicio / Productos /
            <span id="breadcrumbAccion">Nuevo</span>
          </nav>

          <header class="productos-form__header">
            <h1 id="tituloPagina">Nuevo producto</h1>

            <p id="subtituloPagina">
              Completa los datos obligatorios del artículo, precios, stock y
              estado.
            </p>
          </header>

          <section class="productos-form__card">
            <form id="formProducto">
              <input type="hidden" id="productoId" />

              <div
                id="mensajeFormulario"
                class="productos-form__message"
                role="status"
                aria-live="polite"
                hidden
              ></div>

              <div class="productos-form__field">
                <label for="codigo">Código del producto *</label>
                <input
                  type="text"
                  id="codigo"
                  name="codigo"
                  placeholder="Ej. PROD-001"
                  maxlength="50"
                  autocomplete="off"
                  required
                />
              </div>

              <div class="productos-form__field">
                <label for="nombre">Nombre *</label>
                <input
                  type="text"
                  id="nombre"
                  name="nombre"
                  placeholder="Ej. Karategi blanco"
                  maxlength="150"
                  required
                />
              </div>

              <div class="productos-form__field">
                <label for="categoriaId">Categoría *</label>
                <select id="categoriaId" name="categoriaId" required>
                  <option value="">Cargando categorías...</option>
                </select>
              </div>

              <div class="productos-form__field">
                <label for="estado">Estado *</label>
                <select id="estado" name="estado" required>
                  <option value="ACTIVO">ACTIVO</option>
                  <option value="INACTIVO">INACTIVO</option>
                </select>
              </div>

              <div class="productos-form__field">
                <label for="descripcion">Descripción</label>
                <textarea
                  id="descripcion"
                  name="descripcion"
                  rows="3"
                  maxlength="1000"
                  placeholder="Describe las características del producto."
                ></textarea>
              </div>

              <div class="productos-form__grid">
                <div class="productos-form__field">
                  <label for="precioCompra">Precio de compra (S/) *</label>
                  <input
                    type="number"
                    id="precioCompra"
                    name="precioCompra"
                    min="0"
                    step="0.01"
                    value="0.00"
                    required
                  />
                </div>

                <div class="productos-form__field">
                  <label for="precioVenta">Precio de venta (S/) *</label>
                  <input
                    type="number"
                    id="precioVenta"
                    name="precioVenta"
                    min="0"
                    step="0.01"
                    value="0.00"
                    required
                  />
                </div>
              </div>

              <div class="productos-form__grid">
                <div class="productos-form__field">
                  <label for="stockActual">Stock actual *</label>
                  <input
                    type="number"
                    id="stockActual"
                    name="stockActual"
                    min="0"
                    step="1"
                    value="0"
                    required
                  />
                </div>

                <div class="productos-form__field">
                  <label for="stockMinimo">Stock mínimo *</label>
                  <input
                    type="number"
                    id="stockMinimo"
                    name="stockMinimo"
                    min="0"
                    step="1"
                    value="5"
                    required
                  />
                </div>
              </div>

              <div class="productos-form__field">
                <label for="archivo">Imagen del producto (opcional)</label>

                <div class="productos-form__file-box">
                  <div class="productos-form__file-info">
                    <span aria-hidden="true">🖼️</span>
                    <span id="nombreArchivo">Ningún archivo seleccionado</span>
                  </div>

                  <label for="archivo" class="productos-form__file-button">
                    Seleccionar archivo
                  </label>

                  <input
                    type="file"
                    id="archivo"
                    name="archivo"
                    accept="image/png,image/jpeg"
                    class="productos-form__file-input"
                  />
                </div>

                <p class="productos-form__help">
                  Formatos permitidos: PNG y JPG/JPEG.
                </p>

                <div
                  id="imagenActual"
                  class="productos-form__current-image"
                  hidden
                >
                  <p>Imagen registrada actualmente:</p>
                  <span id="nombreImagenActual"></span>
                </div>
              </div>

              <div class="productos-form__actions">
                <button
                  type="submit"
                  id="btnGuardar"
                  class="productos-form__button productos-form__button--primary"
                >
                  Guardar
                </button>

                <button
                  type="button"
                  id="btnCancelar"
                  class="productos-form__button productos-form__button--secondary"
                >
                  Cancelar
                </button>
              </div>
            </form>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
