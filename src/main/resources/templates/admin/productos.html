<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <title>Productos | Sunkku Sinchi</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <script th:src="@{/js/acordeon.js}" defer></script>
    <script th:src="@{/js/nav-acordeon.js}" defer></script>
    <script th:src="@{/js/topbar.js}" defer></script>
    <script th:src="@{/js/logout.js}" defer></script>
    <script th:src="@{/js/productos/productos.js}" defer></script>
  </head>

  <body>
    <main class="app-layout">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
      <div id="mobileMenuOverlay" class="mobile-menu-overlay" hidden></div>

      <section class="main-content">
        <div class="mobile-nav">
          <button
            type="button"
            class="mobile-menu-button"
            id="mobileMenuButton"
            aria-label="Abrir menú"
            aria-expanded="false"
            aria-controls="mainSidebar"
          >
            <span id="mobileMenuIcon">☰</span>
          </button>

          <strong class="mobile-nav__logo">SUNKKU SINCHI</strong>
        </div>

        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <div
          class="productos-page content-wrapper"
          th:attr="
            data-api-productos=@{/api/productos},
            data-api-categorias=@{/api/categorias},
            data-nuevo-url=@{/admin/productos/nuevo},
            data-editar-url=@{/admin/productos/editar/},
            data-vista-previa-url=@{/admin/vista-nueva}
          "
        >
          <nav class="productos-breadcrumb" aria-label="Ruta de navegación">
            Inicio / Gestión / Productos
          </nav>

          <header class="productos-header">
            <div>
              <h1 class="productos-title">Productos</h1>
              <p class="productos-description">
                Gestiona el equipamiento y los artículos del dojo.
              </p>
            </div>

            <button
              type="button"
              id="btnNuevoProducto"
              class="productos-button productos-button--primary"
            >
              <span aria-hidden="true">+</span>
              Nuevo producto
            </button>
          </header>

          <section class="productos-filters" aria-label="Filtros de productos">
            <div class="productos-field">
              <label for="inputBuscar">Buscar por nombre o código</label>
              <input
                type="search"
                id="inputBuscar"
                placeholder="Ej. Karategi o PROD-001"
                autocomplete="off"
              />
            </div>

            <div class="productos-field">
              <label for="selectFiltroCategoria"> Filtrar por categoría </label>
              <select id="selectFiltroCategoria">
                <option value="">Todas las categorías</option>
              </select>
            </div>

            <p
              id="contadorProductos"
              class="productos-counter"
              role="status"
              aria-live="polite"
            >
              Cargando productos...
            </p>
          </section>

          <section
            class="productos-table-container"
            aria-label="Catálogo de productos"
          >
            <table class="productos-table">
              <thead>
                <tr>
                  <th scope="col">Código</th>
                  <th scope="col">Producto / Nombre</th>
                  <th scope="col">Categoría</th>
                  <th scope="col">P. Compra</th>
                  <th scope="col">P. Venta</th>
                  <th scope="col">Stock actual</th>
                  <th scope="col">Stock mín.</th>
                  <th scope="col">Estado</th>
                  <th scope="col" class="productos-actions-heading">
                    Acciones
                  </th>
                </tr>
              </thead>

              <tbody id="tablaProductosBody">
                <tr>
                  <td colspan="9" class="productos-table-message">
                    Cargando productos...
                  </td>
                </tr>
              </tbody>
            </table>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
