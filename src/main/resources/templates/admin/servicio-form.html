<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <title>Gestión de Servicios | Sunkku Sinchi</title>

    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <script th:src="@{/js/acordeon.js}" defer></script>
    <script th:src="@{/js/nav-acordeon.js}" defer></script>
    <script th:src="@{/js/topbar.js}" defer></script>
    <script th:src="@{/js/logout.js}" defer></script>
    <script th:src="@{/js/servicios/servicio-form.js}" defer></script>
  </head>

  <body>
    <main class="app-layout">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
      <div id="mobileMenuOverlay" class="mobile-menu-overlay" hidden></div>

      <section class="main-content">
        <div class="mobile-nav">
          <button
            type="button"
            class="mobile-menu-button"
            id="mobileMenuButton"
            aria-label="Abrir menú"
            aria-expanded="false"
            aria-controls="mainSidebar"
          >
            <span id="mobileMenuIcon">☰</span>
          </button>

          <strong class="mobile-nav__logo">SUNKKU SINCHI</strong>
        </div>

        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <div
          class="servicio-form-page content-wrapper"
          th:attr="
            data-api-servicios=@{/api/servicios},
            data-api-categorias=@{/api/categorias},
            data-listado-url=@{/admin/servicios},
            data-servicio-id=${servicioId}
          "
        >
          <nav
            class="servicio-form__breadcrumb"
            aria-label="Ruta de navegación"
          >
            Inicio / Servicios /
            <span id="breadcrumbAccion">Nuevo</span>
          </nav>

          <header class="servicio-form__header">
            <h1 id="tituloPagina">Nuevo servicio</h1>

            <p id="subtituloPagina">
              Completa los datos del servicio, precio, duración, capacidad y
              estado.
            </p>
          </header>

          <section class="servicio-form__card">
            <form id="formServicio">
              <input type="hidden" id="servicioId" />

              <div
                id="mensajeFormulario"
                class="servicio-form__message"
                role="status"
                aria-live="polite"
                hidden
              ></div>

              <div class="servicio-form__field">
                <label for="codigo">Código del servicio *</label>
                <input
                  type="text"
                  id="codigo"
                  name="codigo"
                  placeholder="Ej. SERV-001"
                  maxlength="50"
                  autocomplete="off"
                  required
                />
              </div>

              <div class="servicio-form__field">
                <label for="nombre">Nombre del servicio *</label>
                <input
                  type="text"
                  id="nombre"
                  name="nombre"
                  placeholder="Ej. Clases de karate"
                  maxlength="150"
                  required
                />
              </div>

              <div class="servicio-form__field">
                <label for="categoriaId">Categoría *</label>
                <select id="categoriaId" name="categoriaId" required>
                  <option value="">Cargando categorías...</option>
                </select>
              </div>

              <div class="servicio-form__field">
                <label for="estado">Estado *</label>
                <select id="estado" name="estado" required>
                  <option value="ACTIVO">ACTIVO</option>
                  <option value="INACTIVO">INACTIVO</option>
                </select>
              </div>

              <div class="servicio-form__field">
                <label for="descripcion">Descripción</label>
                <textarea
                  id="descripcion"
                  name="descripcion"
                  rows="3"
                  maxlength="1000"
                  placeholder="Describe las características del servicio."
                ></textarea>
              </div>

              <div class="servicio-form__field">
                <label for="precio">Precio (S/) *</label>
                <input
                  type="number"
                  id="precio"
                  name="precio"
                  min="0"
                  step="0.01"
                  value="0.00"
                  required
                />
              </div>

              <div class="servicio-form__grid">
                <div class="servicio-form__field">
                  <label for="duracionMinutos"> Duración (minutos) </label>
                  <input
                    type="number"
                    id="duracionMinutos"
                    name="duracionMinutos"
                    min="1"
                    step="1"
                    placeholder="Ej. 60"
                  />
                </div>

                <div class="servicio-form__field">
                  <label for="capacidad">Capacidad</label>
                  <input
                    type="number"
                    id="capacidad"
                    name="capacidad"
                    min="1"
                    step="1"
                    placeholder="Ej. 20"
                  />
                </div>
              </div>

              <div class="servicio-form__field">
                <label for="imagen"> Imagen del servicio (opcional) </label>

                <div class="servicio-form__file-box">
                  <div class="servicio-form__file-info">
                    <span aria-hidden="true">🖼️</span>
                    <span id="nombreArchivoImagen">
                      Ningún archivo seleccionado
                    </span>
                  </div>

                  <label for="imagen" class="servicio-form__file-button">
                    Seleccionar archivo
                  </label>

                  <input
                    type="file"
                    id="imagen"
                    name="imagen"
                    accept="image/jpeg,image/png,image/webp"
                    class="servicio-form__file-input"
                    aria-describedby="imagenAyuda"
                  />
                </div>

                <p class="servicio-form__help" id="imagenAyuda">
                  Formatos permitidos: JPG, PNG y WEBP. Tamaño máximo: 5 MB.
                </p>

                <div
                  id="imagenActual"
                  class="servicio-form__current-image"
                  hidden
                >
                  <p>Imagen registrada actualmente:</p>
                  <span id="nombreImagenActual"></span>
                </div>

                <div
                  id="contenedorVistaPrevia"
                  class="servicio-form__image-preview"
                  hidden
                >
                  <p id="tituloVistaPrevia">Vista previa de la imagen:</p>

                  <img
                    id="vistaPreviaImagen"
                    alt="Vista previa de la imagen del servicio"
                  />

                  <button
                    type="button"
                    id="btnQuitarImagen"
                    class="servicio-form__button servicio-form__button--secondary"
                  >
                    Quitar nueva imagen
                  </button>
                </div>
              </div>

              <div class="servicio-form__actions">
                <button
                  type="submit"
                  id="btnGuardar"
                  class="servicio-form__button servicio-form__button--primary"
                >
                  Guardar servicio
                </button>

                <button
                  type="button"
                  id="btnCancelar"
                  class="servicio-form__button servicio-form__button--secondary"
                >
                  Cancelar
                </button>
              </div>
            </form>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
