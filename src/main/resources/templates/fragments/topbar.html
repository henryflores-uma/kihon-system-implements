<header th:fragment="topbar" class="topbar">
  <div class="topbar__role">
    <span class="topbar__role-label">Rol</span>
    <strong id="roleDisplay">Administrador</strong>
  </div>

  <div class="topbar__actions">
    <div class="topbar__profile" id="profileMenuContainer">
      <button
        type="button"
        class="topbar__profile-button"
        id="profileMenuButton"
        aria-expanded="false"
        aria-controls="profileMenu"
        aria-label="Abrir menú de usuario"
      >
        <div
          class="topbar__avatar"
          id="userProfileAvatar"
          aria-label="Foto de perfil del usuario"
        >
          <span>U</span>
        </div>

        <div class="topbar__profile-info">
          <strong id="usernameDisplay">Usuario</strong>
          <span id="profileRoleDisplay">Administrador</span>
        </div>

        <span class="topbar__profile-arrow" aria-hidden="true">▼</span>
      </button>

      <div class="topbar__profile-menu" id="profileMenu" hidden>
        <a th:href="@{/admin/admin}" class="topbar__profile-menu-item">
          Panel principal
        </a>

        <button
          type="button"
          class="topbar__profile-menu-item"
          id="topbarLogoutButton"
        >
          Cerrar sesión
        </button>
      </div>
    </div>
  </div>
</header>
