<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión | Sunkku Sinchi</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #101820, #263746);
      }

      .login-card {
        width: 100%;
        max-width: 400px;
        padding: 36px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      }

      .brand {
        text-align: center;
        margin-bottom: 28px;
      }

      .brand h1 {
        margin-bottom: 8px;
        color: #182631;
        font-size: 27px;
      }

      .brand p {
        margin: 0;
        color: #667085;
        font-size: 14px;
      }

      .field {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: bold;
        color: #344054;
      }

      input {
        width: 100%;
        padding: 13px;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        font-size: 15px;
      }

      input:focus {
        outline: 2px solid #9bb9cf;
        border-color: #527c98;
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #1e4258;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: #285a76;
      }

      .message {
        margin-bottom: 18px;
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        text-align: center;
      }

      .error {
        background: #fee4e2;
        color: #b42318;
      }

      .success {
        background: #dcfae6;
        color: #067647;
      }

      .footer {
        margin-top: 22px;
        text-align: center;
        color: #667085;
        font-size: 12px;
      }

      .back-home {
        display: block;
        width: 100%;
        margin-top: 12px;
        padding: 13px;
        text-align: center;
        text-decoration: none;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        color: #344054;
        font-size: 14px;
        font-weight: bold;
        transition: background 0.2s ease;
      }

      .back-home:hover {
        background: #f2f4f7;
      }
    </style>
  </head>

  <body>
    <main class="login-card">
      <header class="brand">
        <h1>Sunkku Sinchi</h1>
        <p>Sistema de administración</p>
      </header>

      <div th:if="${param.error}" class="message error">
        Usuario o contraseña incorrectos, o cuenta deshabilitada.
      </div>

      <div th:if="${param.logout}" class="message success">
        Has cerrado sesión correctamente.
      </div>

      <form th:action="@{/login}" method="post">
        <div class="field">
          <label for="username">Usuario</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Ingresa tu usuario"
            autocomplete="username"
            required
            autofocus
          />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit">Iniciar sesión</button>
        <a href="/" class="back-home"> ← Volver al inicio </a>
      </form>

      <footer class="footer">Acceso exclusivo para personal autorizado</footer>
    </main>
  </body>
</html>
